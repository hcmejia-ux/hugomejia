<title>Gym Cheat Sheet</title>

<style>
/* Layout: sticky day tabs over one training day at a time; each exercise is a block, supersets share one framed card. */
:root {
  --bg: #ECEFF0;
  --surface: #FFFFFF;
  --soft: #F3F5F6;
  --ink: #13171A;
  --muted: #566068;
  --line: #D3D9DC;
  --accent: #F0A500;
  --on-accent: #1A1300;
  --link: #8A5A00;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1114;
    --surface: #171B1F;
    --soft: #1D2227;
    --ink: #EDF0F2;
    --muted: #9AA5AD;
    --line: #2A3036;
    --accent: #F5B400;
    --on-accent: #1A1300;
    --link: #F5B400;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1114;
  --surface: #171B1F;
  --soft: #1D2227;
  --ink: #EDF0F2;
  --muted: #9AA5AD;
  --line: #2A3036;
  --accent: #F5B400;
  --on-accent: #1A1300;
  --link: #F5B400;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--font-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }

.wrap {
  max-width: 720px;
  margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar .wrap { padding-block: 12px 0; }
h1 { margin: 0; font: 700 26px/1.1 var(--font-display); letter-spacing: 0.04em; text-transform: uppercase; }
.sub { margin: 2px 0 0; font-size: 13px; color: var(--muted); }

.tabs { display: flex; gap: 8px; overflow-x: auto; padding-block: 12px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; min-width: 68px; min-height: 48px; padding: 6px 12px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink);
  font: inherit; text-align: left; cursor: pointer;
}
.tab b { display: block; font: 700 17px/1.1 var(--font-display); letter-spacing: 0.05em; text-transform: uppercase; }
.tab span { display: block; font-size: 12px; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.tab[aria-selected="true"] span { color: var(--on-accent); }
.tab:focus-visible, .set:focus-visible, .demo:focus-visible, .reset:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

main.wrap { padding-block: 20px 56px; display: grid; gap: 14px; }

.dayhead { display: grid; gap: 4px; padding-bottom: 2px; }
.kicker { font: 600 14px/1 var(--font-display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
h2 { margin: 0; font: 700 44px/1 var(--font-display); letter-spacing: 0.01em; text-transform: uppercase; text-wrap: balance; }
.units { margin: 4px 0 0; font-size: 13px; color: var(--muted); }

.strip { display: flex; gap: 12px; align-items: baseline; padding: 10px 12px; background: var(--soft); border: 1px solid var(--line); border-radius: 10px; font-size: 14px; }
.strip b { flex: 0 0 auto; min-width: 58px; font: 700 13px/1.2 var(--font-display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.strip span { min-width: 0; }

.group { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.glabel { padding: 8px 14px; font: 700 13px/1.2 var(--font-display); letter-spacing: 0.12em; text-transform: uppercase; }
.glabel small { font: 500 12px var(--font-body); letter-spacing: 0; text-transform: none; opacity: 0.85; margin-left: 6px; }
.group.ss .glabel { background: var(--accent); color: var(--on-accent); }
.group.st .glabel { background: var(--soft); color: var(--muted); border-bottom: 1px solid var(--line); }

.ex { display: grid; gap: 12px; padding: 14px; }
.then { display: flex; align-items: center; gap: 10px; padding: 0 14px; font: 600 12px/1 var(--font-body); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.then::before, .then::after { content: ""; flex: 1; height: 1px; background: var(--line); }

.ex-top { display: flex; gap: 10px; align-items: baseline; }
.tag { flex: 0 0 auto; padding: 2px 8px; border-radius: 6px; background: var(--ink); color: var(--bg); font: 700 14px/1.4 var(--font-display); letter-spacing: 0.06em; }
h3 { margin: 0; min-width: 0; font: 700 23px/1.15 var(--font-display); text-wrap: balance; }

.nums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.num { min-width: 0; padding: 8px 10px; background: var(--soft); border-radius: 10px; }
.num small { display: block; font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.num strong { display: block; font: 700 22px/1.15 var(--font-display); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.num em { font-style: normal; font: 500 12px var(--font-body); color: var(--muted); }

.cue { margin: 0; font-size: 15px; color: var(--muted); }

.links { display: flex; flex-wrap: wrap; gap: 8px; }
.demo {
  display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px;
  border: 1.5px solid var(--link); border-radius: 10px; color: var(--link); font-weight: 600; text-decoration: none;
}
.demo::after { content: "\2197"; }

.sets { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.sets-label { margin-right: 4px; font-size: 12px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.set {
  width: 44px; height: 44px; border: 2px solid var(--line); border-radius: 50%;
  background: var(--surface); color: var(--ink); font: 700 17px/1 var(--font-display); cursor: pointer;
}
.set[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

.reset { justify-self: start; min-height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; background: transparent; color: var(--muted); font: 600 14px var(--font-body); cursor: pointer; }

.prose { display: grid; gap: 14px; }
.prose section { padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.prose h3 { margin-bottom: 8px; font-size: 24px; }
.prose p { margin: 0 0 10px; max-width: 65ch; }
.prose p:last-child { margin-bottom: 0; }
.prose ul { margin: 0; padding-left: 20px; display: grid; gap: 8px; max-width: 65ch; }

@media (prefers-reduced-motion: no-preference) {
  .tab, .set { transition: background-color 0.15s, border-color 0.15s; }
}
@media (min-width: 560px) {
  h2 { font-size: 56px; }
  .ex { padding: 18px; }
}
</style>

    '<div class="dayhead"><span class="kicker">Read once</span><h2>Guide</h2></div>' +
    '<div class="prose">' +
    '<section><h3>Supersets</h3>' +
    '<p>A superset is two exercises done back to back with no rest between them, followed by one normal rest of 60–90 seconds before you repeat the pair.</p>' +
    '<p>Example, Monday: chest press (A1), straight to the pulldown (A2), then rest. That is one round. Do 3 rounds, then move to the next pair.</p>' +
    '<ul>' +
    '<li>Pairing removes about half the rest breaks, so all 5 exercises plus cardio fit in 45 minutes.</li>' +
    '<li>The muscle you just worked recovers while its partner works: push then pull, biceps then triceps, upper then core.</li>' +
    '<li>Your heart rate stays higher between sets, which adds to calorie burn.</li>' +
    '<li>A1/A2 is one pair, B1/B2 is the next. A straight set has no partner: rest after every set.</li>' +
    '<li>If your form slips on the second move, rest between the two or lower the weight.</li>' +
    '</ul></section>' +
    '<section><h3>Picking weights</h3>' +

    '<li><b>Already lifting regularly?</b> Start at the top of the Start range or one step above.</li>' +
    '<li><b>Check the units</b> printed on the Matrix weight stacks (lb or kg) before you pick a number.</li>' +

    day.groups.forEach(function (g) {
      var inner = "";
      g.items.forEach(function (it, idx) {
        if (idx > 0) inner += '<div class="then">then, no rest</div>';
        inner += exercise(day.id, day.id + "-" + (n++), it);
      });
      var sub = g.type === "ss" ? "no rest between the two, then rest 60–90 s" : (g.sub || "");
      html += '<div class="group ' + g.type + '"><div class="glabel">' + esc(g.label) + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</div>' + inner + '</div>';
    });
    html += '<div class="strip"><b>Finish</b><span>' + esc(day.finish) + '</span></div>';
    html += '<button type="button" class="reset" data-day="' + day.id + '">Clear set checks</button>';
    return html;
  }

  function show(id) {
    if (ids.indexOf(id) < 0) id = "mon";
    var day = DAYS.filter(function (d) { return d.id === id; })[0];
    app.innerHTML = day ? renderDay(day) : GUIDE;
    Array.prototype.forEach.call(tabsEl.children, function (b) { b.setAttribute("aria-selected", String(b.dataset.id === id)); });
    var sel = tabsEl.querySelector('[aria-selected="true"]');
    if (sel && sel.scrollIntoView) { try { sel.scrollIntoView({ inline: "center", block: "nearest" }); } catch (e) {} }
    window.scrollTo(0, 0);
  }

  tabsEl.innerHTML = DAYS.map(function (d) {
    return '<button type="button" class="tab" role="tab" data-id="' + d.id + '"><b>' + d.tab + '</b><span>' + esc(d.name) + '</span></button>';
  }).join("") + '<button type="button" class="tab" role="tab" data-id="guide"><b>Guide</b><span>Supersets</span></button>';

  tabsEl.addEventListener("click", function (e) {
    var b = e.target.closest(".tab");
    if (b) { location.hash = b.dataset.id; }
  });

  app.addEventListener("click", function (e) {
    var set = e.target.closest(".set");
    if (set) {
      var key = set.dataset.key, i = +set.dataset.i;
      var arr = state[key] || [];
      arr[i] = !arr[i];
      state[key] = arr;
      save();
      var on = !!arr[i];
      set.setAttribute("aria-pressed", String(on));
      set.setAttribute("aria-label", "Set " + (i + 1) + ", " + (on ? "done" : "not done"));
      return;
    }
    var r = e.target.closest(".reset");
    if (r) {
      Object.keys(state).forEach(function (k) { if (k.indexOf(r.dataset.day + "-") === 0) delete state[k]; });
      save();
      var h = location.hash.slice(1);
      var y = window.scrollY;
      show(h);
      window.scrollTo(0, y);
    }
  });

  window.addEventListener("hashchange", function () { show(location.hash.slice(1)); });

  var start = location.hash.slice(1);
  if (ids.indexOf(start) < 0) {
    var map = { 1: "mon", 2: "tue", 4: "thu", 5: "fri" };
    start = map[new Date().getDay()] || "mon";
  }
  show(start);
})();
</script>

</body></html>
